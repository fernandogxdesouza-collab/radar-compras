name: Avisos de supermercado

on:
  push:
    paths:
      - "dados/ofertas_super.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avisos-super
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Avisar ofertas muito abaixo do normal
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
        run: python avisos_super.py
      - name: Guardar o que já foi avisado
        run: |
          git config user.name "radar-compras"
          git config user.email "radar-compras@users.noreply.github.com"
          git add dados/avisos_super.json
          git diff --cached --quiet || git commit -q -m "Registra avisos de supermercado"
          git pull -q --rebase origin main
          git push -q
