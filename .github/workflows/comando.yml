name: Comando do painel

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        required: true
        options: [buscar, incluir, excluir, alvo]
      texto:
        description: "Produto (ex.: iPhone 15 128GB). Em 'alvo': nome; alvo=100"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: comando-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Executar comando
        id: cmd
        env:
          ACAO: ${{ inputs.acao }}
          TEXTO: ${{ inputs.texto }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python comando.py
      - name: Coletar preços do item incluído
        if: ${{ inputs.acao == 'incluir' }}
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ID_NOVO: ${{ steps.cmd.outputs.id }}
        run: python radar.py "$ID_NOVO"
      - name: Guardar
        run: |
          git config user.name "radar-compras"
          git config user.email "radar-compras@users.noreply.github.com"
          git add -A dados docs produtos.json
          git diff --cached --quiet || git commit -q -m "Comando do painel: ${{ inputs.acao }}"
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase -X theirs origin main; then
              python radar.py --render
              git add -A docs
              git diff --cached --quiet || git commit -q -m "Redesenha o painel"
              git push -q && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
