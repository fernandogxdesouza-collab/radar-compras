name: Comando do painel

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        required: true
        options: [buscar, incluir, excluir, alvo]
      texto:
        description: "Produto (ex.: iPhone 15 128GB). Em 'alvo': nome; alvo=100"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: comando-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Executar comando
        env:
          ACAO: ${{ inputs.acao }}
          TEXTO: ${{ inputs.texto }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python comando.py
      - name: Atualizar lista completa e painel (incluir, excluir, alvo)
        if: ${{ inputs.acao != 'buscar' }}
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python radar.py
      - name: Guardar
        run: |
          git config user.name "radar-compras"
          git config user.email "radar-compras@users.noreply.github.com"
          git add -A dados docs produtos.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Comando do painel: ${{ inputs.acao }}"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
