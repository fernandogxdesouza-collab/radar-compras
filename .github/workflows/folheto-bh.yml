name: Folheto do BH

# Baixa o PDF do folheto do Supermercados BH (Matozinhos) para dados/bh/.
# A rotina de leitura dos folhetos usa esse arquivo, pois o BH não responde à nuvem do Claude.
on:
  schedule:
    - cron: "30 11 * * 1,4"   # antes da rotina das 12:07 UTC (segunda e quinta)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python baixar_bh.py
      - name: Guardar
        run: |
          git config user.name "radar-compras"
          git config user.email "radar-compras@users.noreply.github.com"
          git add -A dados/bh
          git diff --cached --quiet && { echo "folheto sem mudança"; exit 0; }
          git commit -q -m "Folheto do BH: $(python -c "import json;print(json.load(open('dados/bh/folheto.json'))['titulo'])")"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            git rebase --abort || true
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
